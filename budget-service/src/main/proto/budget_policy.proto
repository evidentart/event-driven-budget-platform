syntax = "proto3";

package budget.policy.v1;

option java_multiple_files = true;
option java_package = "com.sea.budget.policy.v1";
option java_outer_classname = "BudgetPolicyProto";

service BudgetPolicyService {
  rpc CanSpend (CanSpendRequest) returns (CanSpendResponse);
}

message CanSpendRequest {
  string user_id = 1;          // UUID string
  string period = 2;           // YYYY-MM
  string category = 3;         // e.g. FOOD, TRANSPORT (string avoids enum coupling)
  int64 amount_cents = 4;      // expense amount in cents
}

message CanSpendResponse {
  bool has_budget = 1;
  bool allowed = 2;                 // recommend warn-only => true
  int64 remaining_cents_after = 3;  // remaining after applying expense
  string status = 4;                // HEALTHY/ON_TRACK/CAUTION/NEAR_LIMIT/EXCEEDED/NO_BUDGET/UNKNOWN
  string warning = 5;               // empty if none
}
