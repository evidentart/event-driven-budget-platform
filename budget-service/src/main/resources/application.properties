spring.application.name=budget-service
server.port=4002
spring.jpa.open-in-view=false
app.accounting.time-zone=${APP_ACCOUNTING_TIME_ZONE:UTC}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/budget-portal}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8181/realms/budget-portal/protocol/openid-connect/certs}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

grpc.server.port=9001
logging.level.root=info
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE_NAME:ai.commands.v1.exchange}
app.rabbitmq.queue=${RABBITMQ_QUEUE_NAME:ai.commands.v1.queue}
app.rabbitmq.generate-routing-key=${RABBITMQ_GENERATE_ROUTING_KEY:ai.insight.generate.v1}
app.rabbitmq.delete-routing-key=${RABBITMQ_DELETE_ROUTING_KEY:ai.insight.delete.v1}

