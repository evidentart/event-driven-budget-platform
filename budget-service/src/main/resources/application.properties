spring.application.name=budget-service
server.port=4002
spring.jpa.open-in-view=false
app.accounting.time-zone=${APP_ACCOUNTING_TIME_ZONE:UTC}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/budget-portal/protocol/openid-connect/certs}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

grpc.server.port=9001
logging.level.root=info

