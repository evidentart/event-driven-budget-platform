spring.datasource.url=jdbc:h2:mem:expense_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.kafka.bootstrap-servers=localhost:9092
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/budget-portal
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8181/realms/budget-portal/protocol/openid-connect/certs
