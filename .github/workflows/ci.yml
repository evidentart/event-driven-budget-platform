name: CI

on:
  pull_request:
  push:
    branches: [portfolio-refactor]

jobs:
  backend-tests:
    name: Backend - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - expense-service
          - budget-service
          - ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Clean test and package
        working-directory: ${{ matrix.service }}
        run: bash ./mvnw -B clean verify

  postgres-integration:
    name: PostgreSQL inbox integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run PostgreSQL-specific inbox test
        working-directory: budget-service
        run: bash ./mvnw -B -Pintegration-tests -Dtest=InboxEventRepositoryIT test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-expense-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smart-expense-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  compose-config:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
