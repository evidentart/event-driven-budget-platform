spring.application.name=ai-service

server.port=4003
logging.level.root=info
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/budget-portal/protocol/openid-connect/certs}

spring.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.mongodb.representation.uuid=standard
spring.data.mongodb.auto-index-creation=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
app.rabbitmq.exchange=${RABBITMQ_EXCHANGE_NAME:ai.commands.v1.exchange}
app.rabbitmq.queue=${RABBITMQ_QUEUE_NAME:ai.commands.v1.queue}
app.rabbitmq.generate-routing-key=${RABBITMQ_GENERATE_ROUTING_KEY:ai.insight.generate.v1}
app.rabbitmq.delete-routing-key=${RABBITMQ_DELETE_ROUTING_KEY:ai.insight.delete.v1}
app.rabbitmq.dlx=${RABBITMQ_DLX_NAME:ai.commands.v1.dlx}
app.rabbitmq.dlq=${RABBITMQ_DLQ_NAME:ai.commands.v1.dlq}
app.rabbitmq.dlq-routing-key=${RABBITMQ_DLQ_ROUTING_KEY:ai.command.dead}
